[package]
name = "ippdme-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Async Tokio TCP client and mock server for the I++ DME protocol"

[dependencies]
ippdme-core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging"], optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"], optional = true }
rustls-pki-types = { version = "1.15.1", features = ["std"], optional = true }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# TLS 1.3 (optionally mutual) transport for IppClient and IppServer.
tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-pki-types"]
