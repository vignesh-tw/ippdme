name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (workspace, excluding Python extension crate)
        run: cargo clippy --workspace --exclude ippdme-py --all-targets -- -D warnings
      - name: Test (workspace, excluding Python extension crate)
        run: cargo test --workspace --exclude ippdme-py
      - name: Clippy and test ippdme-net with TLS
        run: |
          cargo clippy -p ippdme-net --features tls --all-targets -- -D warnings
          cargo test -p ippdme-net --features tls

  cross-compile-arm:
    name: Cross-compile to aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install aarch64 linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build ippdme-core and ippdme-net for ARM64
        run: cargo build -p ippdme-core -p ippdme-net --features ippdme-net/tls --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          # ring (TLS) compiles C/asm, so it needs the cross C compiler too.
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc

  python:
    name: Python bindings (maturin + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@v2
      - name: Create virtualenv
        run: uv venv .venv
      - name: Install maturin and test deps
        run: uv pip install maturin pytest
      - name: Build and install extension
        run: |
          source .venv/bin/activate
          maturin develop -m crates/ippdme-py/Cargo.toml
      - name: Run pytest
        run: |
          source .venv/bin/activate
          pytest tests/
      - name: Run the Python examples against the example imposters
        run: |
          source .venv/bin/activate
          examples/python/run-all.sh
